<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Display (Low Latency)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateZ(0); /* Forces hardware GPU acceleration */
        }
        #controls {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #444;
        }
        select, button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        #status-msg {
            color: white;
            position: absolute;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="controls">
        <select id="video-select"></select>
        <select id="res-select">
            <option value="720" selected>720p (Fastest / Low Lag)</option>
            <option value="1080">1080p (High Quality)</option>
            <option value="480">480p (Ultra Fast)</option>
        </select>
        <button onclick="document.getElementById('controls').style.display='none'">Hide</button>
    </div>

    <div id="status-msg">Connecting to console...</div>
    <video id="console-view" autoplay playsinline muted></video>

    <script>
        let currentStream = null;
        const videoElement = document.getElementById('console-view');
        const videoSelect = document.getElementById('video-select');
        const resSelect = document.getElementById('res-select');
        const statusMsg = document.getElementById('status-msg');

        function getVideoConstraints(deviceId) {
            const res = resSelect.value;
            let width = 1280, height = 720;
            if (res === '1080') { width = 1920; height = 1080; }
            if (res === '480') { width = 854; height = 480; }

            const base = {
                width: { ideal: width },
                height: { ideal: height },
                frameRate: { ideal: 60, max: 60 }
            };

            return deviceId ? { ...base, deviceId: { exact: deviceId } } : base;
        }

        async function startStream(deviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: getVideoConstraints(deviceId),
                    audio: false
                });
                videoElement.srcObject = currentStream;
                statusMsg.style.display = 'none';
            } catch (err) {
                statusMsg.innerText = "Error: Check adapter connection and allow Camera permissions.";
            }
        }

        async function init() {
            await startStream();
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoInputs = devices.filter(d => d.kind === 'videoinput');

            videoSelect.innerHTML = '';
            let captureCardId = null;

            videoInputs.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                videoSelect.appendChild(option);

                const label = device.label.toLowerCase();
                if (!label.includes('front') && !label.includes('back') && !label.includes('ipad')) {
                    captureCardId = device.deviceId;
                }
            });

            if (captureCardId) {
                videoSelect.value = captureCardId;
                await startStream(captureCardId);
            }
        }

        videoSelect.addEventListener('change', () => startStream(videoSelect.value));
        resSelect.addEventListener('change', () => startStream(videoSelect.value));

        window.addEventListener('click', (e) => {
            if (videoElement.paused) videoElement.play();
            if (e.target === videoElement) {
                const controls = document.getElementById('controls');
                if (controls.style.display === 'none') controls.style.display = 'flex';
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
