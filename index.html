<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #controls {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #444;
        }
        select, button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        #status-msg {
            color: white;
            position: absolute;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="controls">
        <select id="video-select"></select>
        <button onclick="document.getElementById('controls').style.display='none'">Hide Menu</button>
    </div>

    <div id="status-msg">Initializing capture card... Tap screen for audio.</div>
    <video id="console-view" autoplay playsinline></video>

    <script>
        let currentStream = null;
        const videoElement = document.getElementById('console-view');
        const videoSelect = document.getElementById('video-select');
        const statusMsg = document.getElementById('status-msg');

        async function startStream(deviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: deviceId 
                    ? { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                    : true,
                audio: true
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                statusMsg.style.display = 'none';
            } catch (err) {
                statusMsg.innerText = "Error: Check adapter connection and allow Camera/Mic permissions.";
            }
        }

        async function init() {
            // 1. Trigger initial permission so Safari reveals device names
            await startStream();

            // 2. Now list all unlocked video devices
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoInputs = devices.filter(d => d.kind === 'videoinput');

            videoSelect.innerHTML = '';
            let captureCardId = null;

            videoInputs.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                videoSelect.appendChild(option);

                // Look for external USB adapter (ignore built-in front/back iPad cameras)
                const label = device.label.toLowerCase();
                if (!label.includes('front') && !label.includes('back') && !label.includes('ipad')) {
                    captureCardId = device.deviceId;
                }
            });

            // 3. Auto-switch to the capture card if detected
            if (captureCardId) {
                videoSelect.value = captureCardId;
                await startStream(captureCardId);
            }
        }

        // Allow manual switching from the dropdown menu
        videoSelect.addEventListener('change', (e) => {
            startStream(e.target.value);
        });

        // Tap anywhere to unmute audio or bring back hidden menu
        window.addEventListener('click', (e) => {
            if (videoElement.paused) videoElement.play();
            if (e.target === videoElement) {
                const controls = document.getElementById('controls');
                if (controls.style.display === 'none') {
                    controls.style.display = 'flex';
                }
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
